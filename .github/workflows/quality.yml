name: Windows quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and pinned development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Black
        run: python -m black --check src tests

      - name: MyPy
        run: python -m mypy src/party_player

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --version=9.0.1 --yes --no-progress

      - name: Verify FFmpeg and real format tests
        shell: pwsh
        run: |
          Get-Command ffmpeg -ErrorAction Stop
          Get-Command ffprobe -ErrorAction Stop
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_ffmpeg_format_integration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pytest
        run: python -m pytest -q
